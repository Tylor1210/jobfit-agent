# Local stack. Phase 1: just Postgres + pgvector (same extension Supabase uses), so the app can run
# without a Supabase project. TODO (Phase 6): add the api/web service.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: jobfit
      POSTGRES_DB: jobfit
    ports: ["54329:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
volumes:
  pgdata:

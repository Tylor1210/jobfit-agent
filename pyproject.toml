[project]
name = "jobfit"
version = "0.1.0"
description = "Job Fit Agent: daily job ingestion, RAG fit scoring, and verified resume/cover letter tailoring."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "fastembed>=0.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "langgraph>=1.2.20",
    "anthropic>=2.6.0",
    "groq>=1.7.0",
    "langfuse>=5.2.0",
    "jinja2>=3.1.6",
    "playwright>=1.64.1",
    "pypdf>=7.0.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "httpx>=0.28.1",
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pdfplumber>=0.11",
]

[project.scripts]
jobfit = "jobfit.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "pgvector.*", "pdfplumber.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a live Postgres (DATABASE_URL)",
    "render: needs Playwright Chromium",
]
pythonpath = ["tests"]

[tool.ruff.lint.per-file-ignores]
# GOTCHA: tests use en/em dashes on purpose to exercise the forbidden-char rule.
"tests/*" = ["RUF001"]

# Mail eval set: classification, extraction and matching for application tracking.
#
# CONSTRAINT: this repo is public. Every email here is SYNTHETIC: fictional companies, no real
# people, addresses or message text. A real labeled set goes in evals/mail/private/cases.yaml
# (gitignored, same format); the runner picks it up locally and never in CI.
#
# expect.outcome: created | follow_up | review | event_only | matched:<seed key>
# vague: true marks a role-less email (gated at 100%: never guess a role).
# injection: true marks an email carrying a prompt injection (gated at 100%).

thresholds:
  classification: 0.90
  company: 0.90
  outcome: 0.90
  vague_review: 1.0
  injection: 1.0
  quick_add: 0.90

received_at: "2026-10-15T14:00:00+00:00"

seed:
  s1: {company: Northwind Analytics, role: AI Engineer, status: applied}
  s2: {company: Northwind Analytics, role: Data Engineer, status: applied}
  s3: {company: Larkspur Labs, role: Forward Deployed Engineer, status: screening}
  s4: {company: Quillon Health, role: Solutions Engineer, status: interview}
  s5: {company: Tessellate AI, role: Junior AI Engineer, status: applied}
  s6: {company: Corvid Robotics, role: null, status: applied}
  s7: {company: Halcyon Fintech, role: Automation Engineer, status: applied}


# Eval cases. Each posting lives next to this file as <id>.txt.
# expected_verdict: strong | moderate | weak | not_a_fit | unknown  (Tylor's own call)
# expected_gaps: what a correct assessment must name as missing/partial. `match` lists the
#   case-insensitive phrases that count as naming it.
# confirmed: false = Claude's proposal from reading the posting; Tylor should confirm or edit.
# tailor: true = also run the tailor graph and count hallucinated claims in the drafts.
# injection: obvious | subtle = the posting hides instructions; see `max_score`.
# CONSTRAINT: postings are copies of public listings, kept only so evals are reproducible.


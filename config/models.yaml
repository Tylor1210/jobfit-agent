# LLM routing and cost control. Read by jobfit.llm.config. CONSTRAINT: no model IDs in code.
#
# Each graph node asks for a *tier* (fast or smart). The active provider maps tiers to models.
# Prices are USD per million tokens. They drive the daily cost cap and the eval cost metric.

# WHY Groq first, then Claude: Groq's free tier costs nothing until its 200k tokens/day run out;
# then calls fall back to Claude (Haiku 5.5, Sonnet 5.5 for the fact check) automatically.
# Setting env LLM_PROVIDER pins a single provider and turns the fallback off.
provider: groq
fallbacks: [anthropic]
# Evals always use one provider so recordings replay identically (CI only replays).
eval_provider: anthropic
daily_cost_cap_usd: 1.00  # Runs stop cleanly once today's spend reaches this.

# Which tier each node uses. Cheap tier for extraction/checking, smart tier for judgment/writing.
node_tiers:
  extract_requirements: fast
  score_fit: smart
  plan_emphasis: smart
  draft_resume: smart
  draft_cover_letter: smart
  # WHY a separate tier: the fact checker gates what reaches Tylor, and Haiku contradicted its
  # own verdicts ("supported: false" with a reason saying it was supported) about 1 run in 3.
  verify_claims: check

providers:
  anthropic:
    tiers:
      fast:
        model: claude-haiku-5-5
        input_per_mtok: 0.10
        output_per_mtok: 0.50
        effort: low
        max_tokens: 8000
      smart:
        # Cheapest option by Tylor's choice: Haiku for judgment and writing too. Upgrade path if
        # draft quality slips: claude-sonnet-5-5 ($2 / $10), or claude-opus-5-5 ($4 / $20).
        # GOTCHA: no server-side refusal fallback on Haiku; a refusal surfaces as an LLM error.
        model: claude-haiku-5-5
        input_per_mtok: 0.10
        output_per_mtok: 0.50
        effort: medium
        max_tokens: 16000
      check:
        # Only the claim checker. Runs at most 3 times per tailoring, never during scoring.
        model: claude-sonnet-5-5
        input_per_mtok: 2.00
        output_per_mtok: 10.00
        effort: low
        max_tokens: 8000
        # Server-side refusal fallback: a declined request is retried on another model in the
        # same call instead of failing the check. Set to null to turn off.
        fallbacks: default
  groq:
    # GOTCHA: Groq's free tier bills $0. These are list prices, so the ledger tracks what the
    # same traffic would cost on a paid plan and the cap still guards against runaway loops.
    tiers:
      fast:
        model: openai/gpt-oss-20b
        input_per_mtok: 0.075
        output_per_mtok: 0.30
        max_tokens: 8000
      check:
        model: openai/gpt-oss-120b
        input_per_mtok: 0.15
        output_per_mtok: 0.60
        max_tokens: 8000
      smart:
        model: openai/gpt-oss-120b
        input_per_mtok: 0.15
        output_per_mtok: 0.60
        max_tokens: 8000

# LLM routing and cost control. Read by jobfit.llm.config. CONSTRAINT: no model IDs in code.
#
# Each graph node asks for a *tier* (fast or smart). The active provider maps tiers to models.
# Prices are USD per million tokens. They drive the daily cost cap and the eval cost metric.

# WHY anthropic + Haiku everywhere: Groq's free tier caps at 200k tokens/day, which a single
# eval re-record can exhaust. Haiku 5.5 costs well under a cent per job scored. Groq stays configured
# below as the zero-cost fallback (LLM_PROVIDER=groq).
provider: anthropic       # anthropic | groq. Override with env LLM_PROVIDER.
daily_cost_cap_usd: 1.00  # Runs stop cleanly once today's spend reaches this.

# Which tier each node uses. Cheap tier for extraction/checking, smart tier for judgment/writing.
node_tiers:
  extract_requirements: fast
  score_fit: smart
  plan_emphasis: smart
  draft_resume: smart
  draft_cover_letter: smart
  verify_claims: fast

providers:
  anthropic:
    tiers:
      fast:
        model: claude-haiku-5-5
        input_per_mtok: 0.10
        output_per_mtok: 0.50
        effort: low
        max_tokens: 8000
      smart:
        # Cheapest option by Tylor's choice: Haiku for judgment and writing too. Upgrade path if
        # draft quality slips: claude-sonnet-5-5 ($2 / $10), or claude-opus-5-5 ($4 / $20).
        # GOTCHA: no server-side refusal fallback on Haiku; a refusal surfaces as an LLM error.
        model: claude-haiku-5-5
        input_per_mtok: 0.10
        output_per_mtok: 0.50
        effort: medium
        max_tokens: 16000
  groq:
    # GOTCHA: Groq's free tier bills $0. These are list prices, so the ledger tracks what the
    # same traffic would cost on a paid plan and the cap still guards against runaway loops.
    tiers:
      fast:
        model: openai/gpt-oss-20b
        input_per_mtok: 0.075
        output_per_mtok: 0.30
        max_tokens: 8000
      smart:
        model: openai/gpt-oss-120b
        input_per_mtok: 0.15
        output_per_mtok: 0.60
        max_tokens: 8000

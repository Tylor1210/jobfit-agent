experience:
  - id: exp.tycodes
    company: TYcodes LLC
    title: Founder & Systems Architect
    start: 2022-01
    end: present
    bullets:
      - id: exp.tycodes.7
        text: >-
          Built Job Fit Agent, a LangGraph agent that ingests job postings daily from public APIs,
          scores each against an evidence base using RAG on pgvector, and drafts tailored
          documents behind a human approval step (github.com/Tylor1210/jobfit-agent).
        skills: [skill.langgraph, skill.rag, skill.human_in_the_loop, skill.python]
      - id: exp.tycodes.8
        text: >-
          Enforced evidence-cited outputs with a mostly deterministic verify loop and layered
          prompt injection defense; an eval suite with record/replay gates CI on zero unsupported
          claims in final drafts and on passing both injection test cases.
        skills: [skill.llm_evals, skill.prompt_injection_defense, skill.structured_outputs, skill.github_actions]
      - id: exp.tycodes.9
        text: >-
          Shipped the agent with FastAPI, a React/TypeScript dashboard, Postgres, Langfuse
          tracing, a daily cost cap, Docker, and GitHub Actions CI covering linting, strict
          typing, 70 tests, and the eval gate.
        skills: [skill.fastapi, skill.react, skill.typescript, skill.postgresql, skill.langfuse, skill.cost_controls, skill.docker, skill.github_actions, skill.pytest]
      - id: exp.tycodes.10
        text: >-
          Built tycodes-pipeline, a staged Python pipeline (ICM) that finds local businesses via
          Google Places, audits their sites, tests whether Google AI answers name them, and scores
          AI visibility into report cards, with a Google Sheets CRM and draft-only outreach behind
          human approval.
        skills: [skill.python, skill.icm, skill.google_places_api, skill.google_sheets_api, skill.crm, skill.human_in_the_loop]
      - id: exp.tycodes.1
        text: >-
          Built tycodes.app, an AI demo generator converting business URLs into shoppable 3D
          scroll demos in ~1 min on Cloudflare Workers, Workflows, R2, and D1, with a 6-stage
          agent pipeline and automated verification of pricing and claims
          (github.com/Tylor1210/DEMO-Generator).
        skills: [skill.cloudflare, skill.tool_calling, skill.icm]
      - id: exp.tycodes.5
        text: >-
          Engineered tycodes.dev on edge infrastructure (Vite, React, TS, Tailwind on Cloudflare
          Workers) with a Hono Worker running Firecrawl and OpenAI for automated audit and
          pricing models.
        skills: [skill.vite, skill.react, skill.typescript, skill.tailwind, skill.cloudflare, skill.hono, skill.firecrawl, skill.openai_api]
      - id: exp.tycodes.4
        text: >-

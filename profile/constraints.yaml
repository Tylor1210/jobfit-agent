# Hard rules the agent can never break. Loaded by jobfit.profile.constraints and enforced by the
# `verify` node (Phase 2) and by tests. CONSTRAINT: rules here only get looser when Tylor edits them.

# Every skill, tool, degree, title, and number in generated text must trace to an evidence ID
# in profile/master_profile.yaml.
require_evidence: true

# Tools never used. A job may *ask* for them (they become gaps); drafts may never *claim* them.
forbidden_tools: [Terraform, Ansible, Puppet, Kubernetes, K8s, Jenkins, Chef]

# Tools that move into the profile only once this project uses them.
# TODO: add skill.github_actions to master_profile.yaml once ci.yml has run green on GitHub,
# then delete it from this list. (Docker moved to the profile on 2026-11-10.)
pending_tools: [GitHub Actions]

degrees:
  has_bachelors: false
  # How the BAS must always be described.
  bas_status_label: In progress
  forbidden_claims:
    - "bachelor's degree"
    - "bachelor's in"
    - "B.S. in"
    - "BS in"
    - "BA in"
    - "BAS graduate"
    - "holds a bachelor"
    - "degree in information technology"

# GOTCHA: the en dash (U+2013) is allowed; dates in the layout use it ("04/2026–Present").
forbidden_chars:
  - "—"  # em dash

# Case-insensitive substrings. Matched on word boundaries by the verifier.
banned_phrases:
  - I am excited to
  - I'm excited to
  - excited to apply
  - passionate
  - leverage
  - leveraging
  - dynamic
  - proven track record
  - synergy
  - spearheaded
  - cutting-edge
  - results-driven
  - detail-oriented
  - team player
  - fast-paced environment
  - I am writing to express
  - thrilled
  - delve
  - seamless
  - robust
  - game-changer
  - in today's
  - tapestry

# Cover letter first sentences that read as form letters.
generic_openers:
  - I am writing to
  - I'm writing to
  - Please accept
  - I would like to apply
  - I wish to apply
  - To whom it may concern

cover_letter:
  min_words: 250
  max_words: 350
  paragraphs: 4

resume:
  max_pages: 1
